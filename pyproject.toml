[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopoiesis-agent-sys"
version = "0.1.0"
description = "Python Phase 0-1 implementation for a trace-backed self-evolving agent framework and network RCA seed domain."
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
vector-bench = [
  "numpy>=1.24",
  "faiss-cpu>=1.7",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
stream = [
  "confluent-kafka>=2.6,<3",
]
# OPTIONAL. The core writes its own complete, replayable node ledger. Langfuse is
# a downstream OpenTelemetry-backed projection for dashboards and annotation.
observability = [
  "langfuse>=4.7,<5",
]
ingestor = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
# OPTIONAL. The deterministic core stays zero-dependency; this extra powers the
# production HybridKBRetriever dense/HNSW stage and the dense evaluation drivers.
# Heavy imports remain lazy. Install into a dedicated venv, e.g.:
#   python3 -m venv .venv-dense && . .venv-dense/bin/activate
#   pip install sentence-transformers faiss-cpu torch
dense = [
  "sentence-transformers>=2.2",
  "faiss-cpu>=1.7",
  "torch>=2.0",
]
# OPTIONAL. Powers the HybridKBRetriever cross-encoder stage and reranker evals.
# Like `dense`, imports remain lazy and tests importorskip it. The CrossEncoder ships with
# sentence-transformers, so this reuses that dep; torch is its runtime. The public
# BEIR SciFact benchmark it evaluates on is downloaded with the stdlib (no extra pkg).
#   pip install sentence-transformers torch     # (already present in .venv-dense)
rerank = [
  "sentence-transformers>=2.2",
  "torch>=2.0",
]
public-aiops = [
  "pandas>=2.2",
  "pyarrow>=16",
  "PyYAML>=6",
]

# Flat repo layout: the importable packages are core/ and domains/. Pin
# discovery so the editable install does not trip over frontend/, tests_py/,
# eval_mem_compare/ and benchmark_results/ as stray top-level packages.
[tool.setuptools.packages.find]
include = ["core*", "domains*"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
pythonpath = ["."]
markers = [
  "performance: opt-in scale and latency benchmarks",
  "live: opt-in checks that touch the real network/loopback",
]
