name: benchmarks

on:
  workflow_dispatch:
  schedule:
    # Weekly deterministic benchmark smoke — Monday 06:00 UTC.
    - cron: "0 6 * * 1"

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install core + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Deterministic benchmark run (seed / synthetic fixtures)
        run: |
          python3 examples/benchmarks.py
          python3 -m core.eval.memory_effectiveness_suite

      - name: Memory effectiveness contract
        run: python3 -m pytest -q tests_py/test_memory_ablation.py tests_py/test_memory_effectiveness_suite.py
