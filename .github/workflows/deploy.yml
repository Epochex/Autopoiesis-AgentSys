name: deploy

# Deployment to the live r450 box (LAN-only, bare-metal systemd + nginx). Runs
# on a self-hosted runner registered on r450, which operates directly on the
# live tree at /data/Autopoiesis-AgentSys via deploy.sh: fast-forward to main,
# rebuild dist, refresh gateway deps, restart the service, health-check :8026.
# Dirty-tree safe (see deploy.sh).
#
# MANUAL ONLY: triggered from the Actions tab (workflow_dispatch), not on push.
# The box is LAN-only so GitHub-hosted runners can't reach it, and a push trigger
# with no self-hosted runner just queues forever. Register a runner and add a
# `push:` trigger here to turn on true push-to-deploy; until then deploy on
# demand with this workflow or by running frontend/script/deploy.sh on the box.

on:
  workflow_dispatch:
    inputs:
      allow_dirty:
        description: "Deploy the live working tree as-is (skip git fast-forward)"
        type: boolean
        default: false

concurrency:
  group: deploy-live-r450
  cancel-in-progress: false

jobs:
  rollout:
    # Register the r450 runner with labels: self-hosted, r450
    runs-on: [self-hosted, r450]
    steps:
      - name: Roll out to live
        env:
          APP_DIR: /data/Autopoiesis-AgentSys
          SERVICE: netops-ops-console-backend
          HEALTH_URL: http://127.0.0.1:8026/api/healthz
          ALLOW_DIRTY: ${{ inputs.allow_dirty && '1' || '0' }}
        run: bash "$APP_DIR/frontend/script/deploy.sh"
