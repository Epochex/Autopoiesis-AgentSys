name: deploy

# Continuous deployment to the live r450 box (LAN-only, bare-metal systemd +
# nginx). Runs on the self-hosted runner registered on r450 (labels:
# self-hosted, r450), which operates directly on the live tree at
# /data/Autopoiesis-AgentSys via deploy.sh: fast-forward to main, rebuild dist,
# refresh gateway deps, restart the service, health-check :8026. Dirty-tree safe.
#
# Push-to-deploy: every push to main that passes review lands live here. Only
# push (owner creds) and manual dispatch trigger this — no pull_request — so a
# fork PR can never run code on the self-hosted runner.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_dirty:
        description: "Deploy the live working tree as-is (skip git fast-forward)"
        type: boolean
        default: false

concurrency:
  group: deploy-live-r450
  cancel-in-progress: false

jobs:
  rollout:
    # Register the r450 runner with labels: self-hosted, r450
    runs-on: [self-hosted, r450]
    steps:
      - name: Roll out to live
        env:
          APP_DIR: /data/Autopoiesis-AgentSys
          SERVICE: netops-ops-console-backend
          HEALTH_URL: http://127.0.0.1:8026/api/healthz
          ALLOW_DIRTY: ${{ inputs.allow_dirty && '1' || '0' }}
        run: bash "$APP_DIR/frontend/script/deploy.sh"
